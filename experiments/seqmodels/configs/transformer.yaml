model:
  embedding_size: 128
  context: 256
  num_heads: 8
  depth: 12
  attention_type: default
  dropout_rate: 0.25

training:
  batch_size: 256
  learning_rate: 0.0008
  lr_warmup: 3125
  gradient_clipping: 1.0
  num_batches: 6250

evaluation:
  test_every: 500
  test_subset: 100000
  test_batchsize: 256
  sample_length: 600

dataset:
  dataset_name: allenai/c4
  dataset_config: realnewslike
  dataset_split: train
  tokenizer_path: playground/bpe-tokenizer
  tokenizer_vocab_size: 8000
  tokenizer_training_docs: 200000
  target_tokens: 500000000
  train_ratio: 0.9
  val_ratio: 0.05
  test_ratio: 0.05

experiment:
  random_seed: 1
  final: false
  tensorboard_dir: ./runs
  checkpoint_dir: ./transformer_checkpoints
  save_every: 1000
